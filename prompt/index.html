<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prompts | MockPeer</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #030303;
            --card-bg: rgba(255, 255, 255, 0.03);
            --border: rgba(255, 255, 255, 0.08);
            --accent: #3b82f6; /* Electric Blue */
            --text-main: #ededed;
            --text-dim: #a1a1aa;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, sans-serif;
            background-color: var(--bg);
            color: var(--text-main);
            min-height: 100vh;
            padding: 60px 20px;
            overflow-x: hidden;
            line-height: 1.5;
        }

        /* --- BACKGROUND DECO --- */
        .grid-overlay {
            position: fixed;
            inset: 0;
            background-image: radial-gradient(rgba(255,255,255,0.05) 1px, transparent 1px);
            background-size: 32px 32px;
            z-index: -1;
        }

        .glow {
            position: fixed;
            top: -10%;
            left: 50%;
            transform: translateX(-50%);
            width: 600px;
            height: 400px;
            background: radial-gradient(circle, rgba(59, 130, 246, 0.1) 0%, rgba(0, 0, 0, 0) 70%);
            z-index: -1;
            pointer-events: none;
        }

        .container {
            max-width: 1100px;
            margin: 0 auto;
        }

        /* --- HEADER --- */
        header {
            text-align: left;
            margin-bottom: 60px;
        }

        header h1 {
            font-size: 2.5rem;
            font-weight: 700;
            letter-spacing: -0.04em;
            background: linear-gradient(to bottom, #fff 40%, #71717a);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 12px;
        }

        header p {
            font-size: 1.1rem;
            color: var(--text-dim);
            font-weight: 300;
        }

        /* --- UI ELEMENTS --- */
        .search-box {
            margin-bottom: 24px;
        }

        .search-box input {
            width: 100%;
            padding: 14px 20px;
            border: 1px solid var(--border);
            border-radius: 10px;
            font-size: 1rem;
            background: rgba(255, 255, 255, 0.02);
            color: white;
            transition: all 0.2s ease;
        }

        .search-box input:focus {
            outline: none;
            border-color: var(--accent);
            background: rgba(255, 255, 255, 0.05);
            box-shadow: 0 0 20px rgba(59, 130, 246, 0.1);
        }

        .filter-buttons {
            display: flex;
            gap: 8px;
            margin-bottom: 40px;
        }

        .filter-btn {
            padding: 6px 14px;
            border: 1px solid var(--border);
            background: transparent;
            color: var(--text-dim);
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: 500;
            transition: all 0.2s ease;
        }

        .filter-btn:hover {
            border-color: rgba(255, 255, 255, 0.2);
            color: white;
        }

        .filter-btn.active {
            background: white;
            color: black;
            border-color: white;
        }

        /* --- CARDS GRID --- */
        .cards-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 20px;
        }

        .card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 24px;
            display: flex;
            flex-direction: column;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            backdrop-filter: blur(4px);
        }

        .card:hover {
            border-color: rgba(59, 130, 246, 0.5);
            background: rgba(255, 255, 255, 0.05);
            transform: translateY(-4px);
        }

        .card-category {
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: var(--accent);
            font-weight: 700;
            margin-bottom: 12px;
        }

        .card-title {
            font-size: 1.25rem;
            font-weight: 600;
            margin-bottom: 10px;
            letter-spacing: -0.02em;
        }

        .card-description {
            color: var(--text-dim);
            font-size: 0.9rem;
            margin-bottom: 24px;
            flex-grow: 1;
        }

        .card-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.75rem;
            color: #52525b;
        }

        .view-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border);
            color: white;
            padding: 8px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.8rem;
            font-weight: 500;
            transition: 0.2s;
        }

        .view-btn:hover {
            background: white;
            color: black;
        }

        /* --- MODAL --- */
        .modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(8px);
            z-index: 1000;
            padding: 20px;
        }

        .modal-content {
            background: #0a0a0a;
            border: 1px solid var(--border);
            margin: 40px auto;
            max-width: 800px;
            width: 100%;
            border-radius: 16px;
            padding: 32px;
            position: relative;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            max-height: 80vh;
            overflow-y: auto;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
        }

        .modal-body-code {
            background: #000;
            padding: 20px;
            border-radius: 8px;
            border: 1px solid var(--border);
            color: #d4d4d8;
            font-family: 'Monaco', 'Consolas', monospace;
            font-size: 0.85rem;
            line-height: 1.6;
            overflow-x: auto;
            white-space: pre-wrap;
        }

        .copy-btn {
            background: var(--accent);
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.8rem;
            font-weight: 600;
            transition: all 0.2s ease;
        }

        .copy-btn:hover {
            opacity: 0.9;
        }

        .copy-btn.copied {
            background: #10b981;
        }

        .close {
            color: var(--text-dim);
            cursor: pointer;
            font-size: 1.5rem;
            transition: color 0.2s ease;
        }

        .close:hover {
            color: white;
        }

        @media (max-width: 768px) {
            header h1 { font-size: 2rem; }
            .filter-buttons { overflow-x: auto; padding-bottom: 10px; }
        }
    </style>
</head>
<body>
    <div class="grid-overlay"></div>
    <div class="glow"></div>

    <div class="container">
        <header>
            <h1>Development Prompts</h1>
            <p>A curated library of modular code components.</p>
        </header>

        <div class="search-box">
            <input type="text" id="searchInput" placeholder="Filter by keyword (e.g. 'Auth', 'API')...">
        </div>

        <div class="filter-buttons">
            <button class="filter-btn active" data-filter="all">All</button>
            <button class="filter-btn" data-filter="development">Development</button>
            <button class="filter-btn" data-filter="security">Security</button>
        </div>

        <div class="cards-grid" id="cardsContainer"></div>

        <div id="emptyState" style="display: none; text-align: center; margin-top: 100px; color: #52525b;">
            <h2>No results match your search.</h2>
        </div>
    </div>

    <div id="detailModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 class="modal-title"></h2>
                <div style="display: flex; gap: 12px; align-items: center;">
                    <button class="copy-btn" onclick="copyToClipboard()">Copy Snippet</button>
                    <span class="close" onclick="closeModal()">&times;</span>
                </div>
            </div>
            <div class="modal-body-code" id="modalBodyCode"></div>
        </div>
    </div>

    <script>
        let prompts = [];
        let filteredPrompts = [];

        async function loadData() {
            try {
                const response = await fetch('./data.json');
                const data = await response.json();
                prompts = data.prompts;
                filteredPrompts = prompts;
                renderCards();
            } catch (error) {
                console.error('Error loading data:', error);
            }
        }

        function renderCards() {
            const container = document.getElementById('cardsContainer');
            const emptyState = document.getElementById('emptyState');

            if (filteredPrompts.length === 0) {
                container.style.display = 'none';
                emptyState.style.display = 'block';
                return;
            }

            container.style.display = 'grid';
            emptyState.style.display = 'none';

            container.innerHTML = filteredPrompts.map(prompt => `
                <div class="card">
                    <div class="card-category">${prompt.category}</div>
                    <h3 class="card-title">${escapeHtml(prompt.title)}</h3>
                    <p class="card-description">${escapeHtml(prompt.description)}</p>
                    <div class="card-footer">
                        <span>${formatDate(prompt.createdAt)}</span>
                        <button class="view-btn" onclick="openModal('${prompt.id}')">Explore →</button>
                    </div>
                </div>
            `).join('');
        }

        function openModal(promptId) {
            const prompt = prompts.find(p => p.id === promptId);
            if (!prompt) return;
            const modal = document.getElementById('detailModal');
            modal.querySelector('.modal-title').textContent = prompt.title;
            modal.querySelector('#modalBodyCode').textContent = prompt.content;
            modal.dataset.content = prompt.content;
            modal.style.display = 'block';
        }

        function closeModal() {
            document.getElementById('detailModal').style.display = 'none';
        }

        function copyToClipboard() {
            const modal = document.getElementById('detailModal');
            const content = modal.dataset.content;
            
            if (!content) return;

            navigator.clipboard.writeText(content).then(() => {
                const btn = modal.querySelector('.copy-btn');
                const originalText = btn.textContent;
                btn.textContent = '✓ Copied!';
                btn.classList.add('copied');
                
                setTimeout(() => {
                    btn.textContent = originalText;
                    btn.classList.remove('copied');
                }, 2000);
            }).catch(err => {
                console.error('Failed to copy:', err);
            });
        }

        document.getElementById('searchInput').addEventListener('input', (e) => {
            const query = e.target.value.toLowerCase();
            const activeFilter = document.querySelector('.filter-btn.active').dataset.filter;

            filteredPrompts = prompts.filter(p => {
                const matchesSearch = p.title.toLowerCase().includes(query) ||
                                    p.description.toLowerCase().includes(query);
                const matchesFilter = activeFilter === 'all' || p.category === activeFilter;
                return matchesSearch && matchesFilter;
            });

            renderCards();
        });

        document.querySelectorAll('.filter-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');

                const filter = btn.dataset.filter;
                const query = document.getElementById('searchInput').value.toLowerCase();

                filteredPrompts = prompts.filter(p => {
                    const matchesSearch = p.title.toLowerCase().includes(query) ||
                                        p.description.toLowerCase().includes(query);
                    const matchesFilter = filter === 'all' || p.category === filter;
                    return matchesSearch && matchesFilter;
                });

                renderCards();
            });
        });

        function formatDate(dateString) {
            const date = new Date(dateString);
            return date.toLocaleDateString('en-US', {
                year: 'numeric',
                month: 'short',
                day: 'numeric'
            });
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        window.addEventListener('click', (e) => {
            const modal = document.getElementById('detailModal');
            if (e.target === modal) {
                closeModal();
            }
        });

        loadData();
    </script>
</body>
</html>

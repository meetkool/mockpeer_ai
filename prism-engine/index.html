<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>PRISM Pro - Modular Engine</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="/prism-engine/style.css">
</head>

<body>

    <div
        class="fixed top-4 left-4 z-50 bg-slate-900/90 p-4 rounded-xl border border-slate-700 shadow-2xl backdrop-blur-md w-72">
        <h1 class="text-sky-400 font-black text-xl mb-1">PRISM ENGINE</h1>
        <p class="text-[10px] text-slate-500 font-bold uppercase mb-3">Modular System v1.0</p>

        <div class="grid grid-cols-2 gap-2 mb-3">
            <button onclick="createNode('User', 'User', '#0ea5e9')" class="btn-node hover:bg-sky-600 border-sky-900">+
                USER</button>
            <button onclick="createNode('Server', 'API Gateway', '#6366f1')"
                class="btn-node hover:bg-indigo-600 border-indigo-900">+ SERVER</button>
            <button onclick="createNode('Database', 'Primary DB', '#f97316')"
                class="btn-node hover:bg-orange-600 border-orange-900">+ DATABASE</button>
            <button onclick="createNode('Worker', 'K8s Pod', '#ec4899')"
                class="btn-node hover:bg-pink-600 border-pink-900">+ WORKER</button>
        </div>

        <div class="mt-3 pt-3 border-t border-slate-700">
            <p class="text-[9px] text-slate-500 leading-relaxed">
                <strong>Ctrl + Scroll</strong> : Zoom<br>
                <strong>Right Click</strong> : Pan<br>
            </p>
            <button onclick="exportJSON()"
                class="w-full mt-2 bg-emerald-600 hover:bg-emerald-500 text-white text-xs py-2 rounded font-bold transition">SAVE
                SYSTEM</button>
        </div>
    </div>

    <div id="viewport">
        <svg id="cables-layer">
            <defs>
                <!-- 
                    markerUnits="userSpaceOnUse" = arrow size in real pixels, not scaled by stroke-width
                    markerWidth/Height = bounding box of the arrow in pixels
                    refX = how far from the tip to anchor (pushes arrow back so tip doesn't hide under node)
                    refY = vertical center of the arrow shape
                -->
                <marker id="arrow" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto"
                    markerUnits="userSpaceOnUse">
                    <!-- Sharp, clean triangle -->
                    <path d="M2,2 L2,12 L13,7 z" fill="#64748b" />
                </marker>
                <!-- Brighter arrow for the drag-line preview -->
                <marker id="arrow-active" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto"
                    markerUnits="userSpaceOnUse">
                    <path d="M2,2 L2,12 L13,7 z" fill="#38bdf8" />
                </marker>
            </defs>

            <path id="drag-line" d="" stroke="#38bdf8" stroke-width="2" fill="none" stroke-dasharray="6 3"
                style="display:none" marker-end="url(#arrow-active)"></path>
        </svg>

        <div id="world">
            <div id="grid"></div>
            <div id="node-layer"></div>
        </div>
    </div>

    <script src="/prism-engine/prism-core.js"></script>
    <script src="/prism-engine/prism-nodes.js"></script>

    <script>
        // Start the engine
        createNode('User', 'Root User', '#0ea5e9');
        setTimeout(() => createNode('Server', 'App Server', '#6366f1'), 50);
    </script>
</body>

</html>

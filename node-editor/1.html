<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>PRISM - Vis-Network System Architect</title>
    <script type="text/javascript" src="https://unpkg.com/vis-network/standalone/umd/vis-network.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background: #0f172a;
            color: #f8fafc;
            height: 100vh;
            margin: 0;
            display: flex;
            overflow: hidden;
        }

        #network-container {
            flex-grow: 1;
            height: 100%;
            background: #0b0f1a;
            border-left: 1px solid #1e293b;
        }

        .node-label {
            font-family: 'Inter', sans-serif;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <div class="w-80 bg-slate-900 p-6 flex flex-col gap-4 shadow-xl z-10">
        <h1 class="text-2xl font-black text-emerald-400 tracking-tighter">PRISM VIS</h1>
        <p class="text-[10px] text-slate-500 font-bold uppercase tracking-widest">Enterprise VMS Modeler</p>

        <div class="flex flex-col gap-2 mt-4">
            <label class="text-xs font-bold text-slate-400">Import Node JSON</label>
            <textarea id="jsonInput"
                class="bg-slate-950 border border-slate-700 rounded p-3 text-[10px] h-64 font-mono text-emerald-500 focus:border-emerald-500 outline-none"
                placeholder="Paste your JSON here..."></textarea>
            <button onclick="updateNetwork()"
                class="bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-bold py-3 rounded-lg shadow-lg transition-all active:scale-95">
                RE-RENDER SYSTEM
            </button>
        </div>

        <div class="mt-auto p-4 bg-slate-800/50 rounded-lg border border-slate-700">
            <h4 class="text-[10px] font-bold text-slate-300 uppercase mb-1">VMS Inspector</h4>
            <p class="text-[10px] text-slate-400 leading-relaxed">
                Physics: <strong>Enabled</strong><br>
                Scale: <strong>10,000 Users</strong><br>
                Engine: <strong>vis-network</strong>
            </p>
        </div>
    </div>

    <div id="network-container"></div>

    <script type="text/javascript">
        let network = null;

        // Default layout for your Vendor Management System
        const defaultData = {
            nodes: [
                { id: 'user', label: '10k Users', color: '#0ea5e9', shape: 'box', margin: 10 },
                { id: 'gateway', label: 'Managed Gateway', color: '#334155', shape: 'box', margin: 10 },
                { id: 'logic', label: 'FastAPI Core', color: '#6366f1', shape: 'box', margin: 10 },
                { id: 'db', label: 'Vendor DB', color: '#f97316', shape: 'database', margin: 10 },
                { id: 'pay', label: 'Payment Gateway', color: '#10b981', shape: 'box', margin: 10 },
                { id: 'ledger', label: 'Audit Ledger', color: '#ef4444', shape: 'database', margin: 10 }
            ],
            edges: [
                { from: 'user', to: 'gateway', arrows: 'to', dashes: true },
                { from: 'gateway', to: 'logic', arrows: 'to' },
                { from: 'logic', to: 'db', arrows: 'to' },
                { from: 'logic', to: 'pay', arrows: 'to' },
                { from: 'pay', to: 'ledger', arrows: 'to' }
            ]
        };

        function initNetwork(data) {
            const container = document.getElementById('network-container');
            const options = {
                nodes: {
                    font: { color: '#ffffff', size: 14, face: 'Inter' },
                    borderWidth: 2,
                    shadow: true
                },
                edges: {
                    color: '#475569',
                    width: 2,
                    smooth: { type: 'cubicBezier', forceDirection: 'horizontal', roundness: 0.4 }
                },
                physics: {
                    enabled: true,
                    barnesHut: { gravitationalConstant: -2000, centralGravity: 0.3, springLength: 150 },
                    stabilization: { iterations: 150 }
                },
                layout: { randomSeed: 2 }
            };
            network = new vis.Network(container, data, options);
        }

        function updateNetwork() {
            const input = document.getElementById('jsonInput').value;
            try {
                const parsed = JSON.parse(input);
                const nodes = parsed.graph.nodes.map(n => ({
                    id: n.id,
                    label: n.config.name || n.id,
                    color: getColor(n.type),
                    shape: n.type === 'Database' ? 'database' : 'box',
                    margin: 10
                }));
                const edges = parsed.graph.edges.map(e => ({
                    from: e.source,
                    to: e.target,
                    arrows: 'to'
                }));
                initNetwork({ nodes, edges });
            } catch (err) {
                alert("Invalid JSON format. Please check the structure!");
            }
        }

        function getColor(type) {
            const colors = {
                'User': '#0ea5e9',
                'Server': '#6366f1',
                'Database': '#f97316',
                'Cache': '#22c55e',
                'LoadBalancer': '#a855f7',
                'APIGateway': '#334155'
            };
            return colors[type] || '#64748b';
        }

        // Initialize with default VMS data
        window.onload = () => initNetwork(defaultData);
    </script>
</body>

</html>

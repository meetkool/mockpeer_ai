<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MockPeer | Skill Library</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #000000;
            color: #ffffff;
        }

        .sidebar-border {
            border-right: 1px solid rgba(255, 255, 255, 0.1);
        }

        .card-border {
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .header-border {
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        ::-webkit-scrollbar {
            width: 6px;
        }

        ::-webkit-scrollbar-track {
            background: #000;
        }

        ::-webkit-scrollbar-thumb {
            background: #333;
            border-radius: 10px;
        }

        .search-input {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .search-input:focus {
            border-color: #3b82f6;
            outline: none;
            background: rgba(255, 255, 255, 0.05);
        }

        .nav-item {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            padding: 0.5rem 0.75rem;
            border-radius: 0.375rem;
            font-size: 0.875rem;
            transition: all 0.15s ease;
        }

        .nav-item:hover {
            background: rgba(255, 255, 255, 0.05);
            color: #fff;
        }

        .nav-item.active {
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
        }

        .tab-btn {
            padding: 0.375rem 0.75rem;
            border-radius: 0.375rem;
            font-size: 0.75rem;
            transition: all 0.15s ease;
            white-space: nowrap;
        }

        .tab-btn.active {
            background: #fff;
            color: #000;
        }

        .tab-btn:not(.active) {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #9ca3af;
        }

        .tab-btn:not(.active):hover {
            color: #fff;
        }

        .item-card {
            background: rgba(255, 255, 255, 0.02);
            transition: all 0.2s ease;
            cursor: pointer;
        }

        .item-card:hover {
            background: rgba(255, 255, 255, 0.04);
        }

        .item-card:hover .item-title {
            color: #60a5fa;
        }

        .section-title {
            font-size: 0.625rem;
            font-weight: 700;
            color: #6b7280;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 0.125rem 0.5rem;
            border-radius: 0.25rem;
        }
    </style>
</head>

<body class="flex h-screen overflow-hidden">

    <!-- Sidebar Overlay -->
    <div id="sidebarOverlay" class="fixed inset-0 bg-black/50 z-40 hidden md:hidden backdrop-blur-sm transition-opacity"
        onclick="toggleSidebar()"></div>

    <!-- Sidebar -->
    <aside id="sidebar"
        class="fixed inset-y-0 left-0 z-50 w-64 bg-black sidebar-border flex flex-col p-4 transform transition-transform duration-300 -translate-x-full md:translate-x-0 md:static md:shrink-0">
        <div class="flex items-center justify-between px-2 mb-8">
            <div class="flex items-center gap-2">
                <div class="w-6 h-6 bg-blue-600 rounded flex items-center justify-center">
                    <i data-lucide="zap" class="w-4 h-4 text-white"></i>
                </div>
                <span class="font-bold tracking-tight text-lg">MockPeer</span>
            </div>
            <!-- Mobile Close Button -->
            <button onclick="toggleSidebar()" class="md:hidden text-gray-400 hover:text-white">
                <i data-lucide="x" class="w-5 h-5"></i>
            </button>
        </div>

        <nav class="space-y-1">
            <a href="#" class="nav-item active" data-section="skills"
                onclick="if(window.innerWidth < 768) toggleSidebar()">
                <i data-lucide="target" class="w-4 h-4 text-blue-500"></i> Skills
            </a>
            <a href="#" class="nav-item" data-section="prompts" onclick="if(window.innerWidth < 768) toggleSidebar()">
                <i data-lucide="file-code" class="w-4 h-4"></i> Prompts
            </a>
            <a href="#" class="nav-item" data-section="agents" onclick="if(window.innerWidth < 768) toggleSidebar()">
                <i data-lucide="bot" class="w-4 h-4"></i> Agents
            </a>
        </nav>

        <div class="mt-auto p-2">
            <div class="flex items-center gap-3 px-2 py-3 bg-white/5 rounded-lg border border-white/5">
                <div
                    class="w-8 h-8 rounded-full bg-gradient-to-tr from-blue-500 to-purple-500 flex items-center justify-center text-xs font-bold">
                    M</div>
                <div class="overflow-hidden">
                    <p class="text-xs font-medium truncate">Meet Bhanushali</p>
                    <p class="text-[10px] text-gray-500 truncate">SDE-1 @ Resolect</p>
                </div>
            </div>
        </div>
    </aside>

    <main class="flex-1 flex flex-col overflow-hidden">
        <header class="h-14 header-border flex items-center justify-between px-6 bg-black/50 backdrop-blur-md">
            <div class="flex items-center gap-4">
                <button onclick="toggleSidebar()" class="md:hidden text-gray-400 hover:text-white">
                    <i data-lucide="menu" class="w-5 h-5"></i>
                </button>
                <h1 class="text-sm font-semibold" id="sectionTitle">Skills</h1>
                <div class="h-4 w-[1px] bg-white/10"></div>
                <p class="text-xs text-gray-500 truncate max-w-[120px] sm:max-w-none" id="totalCount">128 Total
                    Abilities</p>
            </div>
            <div class="flex items-center gap-3">
                <button class="text-gray-400 hover:text-white transition"><i data-lucide="bell"
                        class="w-4 h-4"></i></button>
                <button
                    class="bg-blue-600 hover:bg-blue-500 text-white text-xs px-3 py-1.5 rounded-md font-medium transition">+
                    New</button>
            </div>
        </header>

        <!-- Mobile Menu Hint -->
        <div id="mobileMenuHint"
            class="fixed top-14 left-6 z-50 md:hidden flex flex-col items-start animate-bounce pointer-events-none transition-opacity duration-1000">
            <i data-lucide="arrow-up" class="w-6 h-6 text-blue-500"></i>
            <span
                class="bg-blue-600 text-white text-[10px] font-bold px-2 py-1 rounded-md shadow-lg shadow-blue-900/20">MENU</span>
        </div>

        <div class="px-6 py-4 header-border">
            <div class="flex flex-col md:flex-row gap-4 items-center justify-between">
                <div class="relative w-full md:w-96">
                    <i data-lucide="search" class="absolute left-3 top-1/2 -translate-y-1/2 w-4 h-4 text-gray-500"></i>
                    <input type="text" id="searchInput" placeholder="Search..."
                        class="search-input w-full pl-10 pr-4 py-2 rounded-lg text-sm">
                </div>
                <div class="flex gap-2 w-full md:w-auto overflow-x-auto pb-2 md:pb-0" id="filterTabs">
                    <button class="tab-btn active" data-filter="all">All</button>
                    <button class="tab-btn" data-filter="development">Development</button>
                    <button class="tab-btn" data-filter="devops">DevOps</button>
                    <button class="tab-btn" data-filter="security">Security</button>
                </div>
            </div>
        </div>

        <div class="flex-1 overflow-y-auto p-6">
            <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-4" id="itemsGrid">
            </div>
        </div>
    </main>

    <div id="detailModal" class="fixed inset-0 z-50 hidden flex items-center justify-center">
        <div class="absolute inset-0 bg-black/80 backdrop-blur-sm" onclick="closeModal()"></div>

        <div
            class="relative bg-[#0a0a0a] border border-white/10 rounded-xl w-full max-w-3xl m-4 max-h-[85vh] flex flex-col shadow-2xl">
            <div class="flex items-center justify-between p-6 border-b border-white/10 bg-white/5 rounded-t-xl">
                <h2 id="modalTitle" class="text-xl font-bold text-white tracking-tight"></h2>
                <button onclick="closeModal()"
                    class="p-2 text-gray-400 hover:text-white transition hover:bg-white/10 rounded-lg">
                    <i data-lucide="x" class="w-5 h-5"></i>
                </button>
            </div>

            <div class="p-6 overflow-y-auto custom-scrollbar">
                <p id="modalDescription"
                    class="text-gray-300 mb-6 text-lg leading-relaxed border-b border-white/5 pb-4"></p>

                <div class="space-y-4">
                    <h3 class="text-sm font-semibold text-gray-500 uppercase tracking-wider">Content Preview</h3>
                    <div class="relative group">
                        <pre id="modalContent"
                            class="bg-black/50 rounded-lg p-4 font-mono text-sm text-gray-300 whitespace-pre-wrap border border-white/5 overflow-x-auto"></pre>
                    </div>
                </div>
            </div>

            <div class="p-4 border-t border-white/10 bg-white/5 rounded-b-xl flex justify-end gap-3">
                <button onclick="closeModal()"
                    class="px-4 py-2 text-sm text-gray-400 hover:text-white transition">Close</button>
                <button onclick="copyModalContent(this)"
                    class="px-4 py-2 text-sm bg-blue-600 hover:bg-blue-500 text-white rounded-md font-medium transition flex items-center gap-2">
                    <i data-lucide="copy" class="w-4 h-4"></i> Copy Content
                </button>
            </div>
        </div>
    </div>

    <script>
        let skillsData = [];
        let promptsData = [];
        let agentsData = [];
        let currentSection = 'skills';
        let currentFilter = 'all';

        const icons = {
            skills: {
                'Authentication Patterns': 'lock',
                'Error Handling Best Practices': 'alert-circle',
                'Vitest Unit Testing': 'test-tube',
                'Playwright E2E Testing': 'globe',
                'tRPC Type-Safe APIs': 'link',
                'GraphQL API Development': 'share-2',
                'Kubernetes Basics': 'box',
                'Docker Containerization': 'container',
                'Socket.io Real-time': 'radio',
                'React Query Data Fetching': 'database',
                'Zod Schema Validation': 'check-circle',
                'shadcn/ui Components': 'palette',
                'TailwindCSS Styling': 'paintbrush',
                'Next.js App Router': 'layout',
                'Stripe Payment Integration': 'credit-card',
                'Redis Caching Patterns': 'hard-drive',
                'Prisma ORM': 'database',
                'OpenAPI/Swagger Documentation': 'book-open',
                'GitHub Actions CI/CD': 'git-branch',
                'Monorepo Management': 'layers',
                'AWS CDK Infrastructure': 'cloud',
                'AWS Secrets Management': 'key',
                'AWS RDS Database': 'server',
                'AWS ECS Containers': 'boxes',
                'AWS IAM Security': 'shield',
                'AWS CloudWatch Monitoring': 'activity',
                'AWS SQS Message Queues': 'message-square',
                'AWS DynamoDB': 'table',
                'AWS Lambda Functions': 'zap',
                'AWS S3 File Storage': 'folder',
                'default': 'target'
            },
            prompts: {
                'Build Data Table': 'table',
                'Create Modal Component': 'maximize-2',
                'Add Social Login': 'log-in',
                'Implement Password Reset': 'key',
                'Build Settings Page': 'settings',
                'Add Tagging System': 'tag',
                'Implement Favorites/Bookmarks': 'bookmark',
                'Add Activity Feed': 'rss',
                'Implement Comments System': 'message-circle',
                'Build Notification System': 'bell',
                'Add Export Feature': 'download',
                'Build Search Feature': 'search',
                'Implement Audit Logging': 'clipboard',
                'Create Email Template': 'mail',
                'Add Input Sanitization': 'shield',
                'Implement Soft Delete': 'trash-2',
                'Handle File Upload': 'upload',
                'Build REST API': 'api',
                'Implement Authorization': 'lock',
                'Set Up Secrets Management': 'key',
                'Configure Auto Scaling': 'trending-up',
                'Set Up Load Balancer': 'server',
                'Configure SSL/TLS': 'lock',
                'Set Up Database Backup': 'database',
                'Configure Nginx': 'server',
                'Set Up Monitoring': 'activity',
                'Deploy to AWS': 'cloud',
                'Configure Docker': 'docker',
                'default': 'file-code'
            },
            agents: {
                'Data Migration Agent': 'database',
                'Session Management Agent': 'key',
                'Database Backup Agent': 'database',
                'Configuration Management Agent': 'settings',
                'Metrics Agent': 'bar-chart-2',
                'Logging Agent': 'file-text',
                'Webhook Agent': 'webhook',
                'Background Jobs Agent': 'clock',
                'File Upload Agent': 'upload',
                'Rate Limiting Agent': 'shield',
                'Notification System Agent': 'bell',
                'Web Scraping Agent': 'globe',
                'Accessibility Audit Agent': 'eye',
                'Search Implementation Agent': 'search',
                'Feature Flag Agent': 'flag',
                'Billing System Agent': 'credit-card',
                'Media Processing Agent': 'image',
                'Email System Agent': 'mail',
                'Content Management Agent': 'book',
                'API Versioning Agent': 'git-branch',
                'User Analytics Agent': 'bar-chart',
                'Localization Agent': 'globe',
                'Code Quality Agent': 'check-circle',
                'Real-Time Data Agent': 'radio',
                'Data Privacy Agent': 'shield',
                'Error Recovery Agent': 'refresh-cw',
                'Code Migration Agent': 'code',
                'Environment Configuration Agent': 'settings',
                'API Testing Agent': 'test-tube',
                'Git Workflow Agent': 'git-branch',
                'SEO Optimization Agent': 'search',
                'Accessibility Expert Agent': 'eye',
                'Mobile Performance Agent': 'smartphone',
                'default': 'bot'
            }
        };

        function getIcon(type, title) {
            return icons[type]?.[title] || icons[type]?.['default'] || 'zap';
        }

        function getCategoryColor(category) {
            const colors = {
                'development': { bg: 'blue-500/10', border: 'blue-500/20', icon: 'blue-400', text: 'blue-400' },
                'devops': { bg: 'green-500/10', border: 'green-500/20', icon: 'green-400', text: 'green-400' },
                'security': { bg: 'red-500/10', border: 'red-500/20', icon: 'red-400', text: 'red-400' },
                'ml': { bg: 'purple-500/10', border: 'purple-500/20', icon: 'purple-400', text: 'purple-400' },
                'default': { bg: 'gray-500/10', border: 'gray-500/20', icon: 'gray-400', text: 'gray-400' }
            };
            return colors[category] || colors['default'];
        }

        function getStatusInfo(item) {
            if (item.usageCount) {
                return { icon: 'play', text: `Used ${item.usageCount}k times`, color: 'green-500' };
            }
            const updated = new Date(item.updatedAt);
            const now = new Date();
            const hours = Math.floor((now - updated) / (1000 * 60 * 60));
            if (hours < 1) return { icon: 'clock', text: 'Updated just now', color: 'orange-500' };
            if (hours < 24) return { icon: 'clock', text: `Updated ${hours}h ago`, color: 'orange-500' };
            const days = Math.floor(hours / 24);
            return { icon: 'clock', text: `Updated ${days}d ago`, color: 'gray-500' };
        }

        let currentContent = '';



        function renderSkills(items) {
            const grid = document.getElementById('itemsGrid');
            grid.innerHTML = items.map(item => {
                const color = getCategoryColor('default');
                const status = getStatusInfo(item);
                const iconName = getIcon('skills', item.title);
                return `
                    <div class="card-border rounded-xl p-4 item-card group" data-id="${item.id}">
                        <div class="flex justify-between items-start mb-3">
                            <div class="w-8 h-8 rounded flex items-center justify-center border ${color.bg} ${color.border}">
                                <i data-lucide="${iconName}" class="w-4 h-4 text-${color.icon}"></i>
                            </div>
                            <span class="section-title">Skill</span>
                        </div>
                        <h3 class="font-semibold text-sm mb-1 item-title">${item.title}</h3>
                        <p class="text-xs text-gray-500 line-clamp-2 mb-4 leading-relaxed">${item.description}</p>
                        <div class="pt-3 border-t border-white/5 flex items-center justify-between">
                            <div class="flex items-center gap-1.5">
                                <i data-lucide="${status.icon}" class="w-3 h-3 text-${status.color}"></i>
                                <span class="text-[10px] text-gray-400">${status.text}</span>
                            </div>
                            <i data-lucide="more-horizontal" class="w-4 h-4 text-gray-600 hover:text-white"></i>
                        </div>
                    </div>
                `;
            }).join('');
            lucide.createIcons();
        }

        function renderPrompts(items) {
            const grid = document.getElementById('itemsGrid');
            grid.innerHTML = items.map(item => {
                const color = getCategoryColor(item.category || 'development');
                const iconName = getIcon('prompts', item.title);
                return `
                    <div class="card-border rounded-xl p-4 item-card group" data-id="${item.id || item.title}">
                        <div class="flex justify-between items-start mb-3">
                            <div class="w-8 h-8 rounded flex items-center justify-center border ${color.bg} ${color.border}">
                                <i data-lucide="${iconName}" class="w-4 h-4 text-${color.icon}"></i>
                            </div>
                            <span class="section-title">Prompt</span>
                        </div>
                        <h3 class="font-semibold text-sm mb-1 item-title">${item.title}</h3>
                        <p class="text-xs text-gray-500 line-clamp-2 mb-4 leading-relaxed">${item.description}</p>
                        <div class="pt-3 border-t border-white/5 flex items-center justify-between">
                            <div class="flex items-center gap-1.5">
                                <span class="text-[10px] px-2 py-0.5 rounded bg-white/5 text-gray-400">${item.category || 'development'}</span>
                            </div>
                            <i data-lucide="more-horizontal" class="w-4 h-4 text-gray-600 hover:text-white"></i>
                        </div>
                    </div>
                `;
            }).join('');
            lucide.createIcons();
        }

        function renderAgents(items) {
            const grid = document.getElementById('itemsGrid');
            grid.innerHTML = items.map(item => {
                const color = getCategoryColor('default');
                const iconName = getIcon('agents', item.name);
                return `
                    <div class="card-border rounded-xl p-4 item-card group" data-id="${item.id || item.name}">
                        <div class="flex justify-between items-start mb-3">
                            <div class="w-8 h-8 rounded-full bg-gradient-to-br from-blue-500 to-purple-500 flex items-center justify-center">
                                <i data-lucide="${iconName}" class="w-4 h-4 text-white"></i>
                            </div>
                            <span class="section-title">Agent</span>
                        </div>
                        <h3 class="font-semibold text-sm mb-1 item-title">${item.name}</h3>
                        <p class="text-xs text-gray-500 line-clamp-2 mb-4 leading-relaxed">${item.description}</p>
                        <div class="pt-3 border-t border-white/5 flex items-center justify-between">
                            <div class="flex items-center gap-1.5">
                                <i data-lucide="zap" class="w-3 h-3 text-yellow-500"></i>
                                <span class="text-[10px] text-gray-400">Expert Agent</span>
                            </div>
                            <i data-lucide="more-horizontal" class="w-4 h-4 text-gray-600 hover:text-white"></i>
                        </div>
                    </div>
                `;
            }).join('');
            lucide.createIcons();
        }

        function filterItems(items) {
            const searchTerm = document.getElementById('searchInput').value.toLowerCase();
            return items.filter(item => {
                const matchesSearch = !searchTerm ||
                    (item.title || item.name).toLowerCase().includes(searchTerm) ||
                    (item.description || '').toLowerCase().includes(searchTerm);
                return matchesSearch;
            });
        }

        function updateDisplay() {
            let items;
            let title;
            let count;

            switch (currentSection) {
                case 'skills':
                    items = filterItems(skillsData);
                    title = 'Skills';
                    count = `${skillsData.length} Total Abilities`;
                    renderSkills(items);
                    break;
                case 'prompts':
                    items = filterItems(promptsData);
                    title = 'Prompts';
                    count = `${promptsData.length} Total Prompts`;
                    renderPrompts(items);
                    break;
                case 'agents':
                    items = filterItems(agentsData);
                    title = 'Agents';
                    count = `${agentsData.length} Total Agents`;
                    renderAgents(items);
                    break;
            }

            document.getElementById('sectionTitle').textContent = title;
            document.getElementById('totalCount').textContent = count;
        }

        document.querySelectorAll('.nav-item').forEach(item => {
            item.addEventListener('click', (e) => {
                e.preventDefault();
                document.querySelectorAll('.nav-item').forEach(i => i.classList.remove('active'));
                item.classList.add('active');
                currentSection = item.dataset.section;
                updateDisplay();
            });
        });

        document.getElementById('searchInput').addEventListener('input', updateDisplay);

        async function loadData() {
            try {
                const [skillsRes, promptsRes, agentsRes] = await Promise.all([
                    fetch('./skills/data.json'),
                    fetch('./prompt/data.json'),
                    fetch('./agents/data.json')
                ]);

                const skillsJson = await skillsRes.json();
                const promptsJson = await promptsRes.json();
                const agentsJson = await agentsRes.json();

                skillsData = skillsJson.skills;
                promptsData = promptsJson.prompts;
                agentsData = agentsJson.agents;

                updateDisplay();
            } catch (error) {
                console.error('Error loading data:', error);
            }
        }

        loadData();

        // 1. Event Delegation: Listen for clicks on the grid container
        document.getElementById('itemsGrid').addEventListener('click', function (e) {
            // Find the closest parent with class 'item-card'
            const card = e.target.closest('.item-card');
            if (!card) return; // If clicked outside a card, do nothing

            const id = card.dataset.id;
            let item;

            // Find the actual data object based on the current section
            if (currentSection === 'skills') {
                item = skillsData.find(i => i.id === id);
            } else if (currentSection === 'prompts') {
                item = promptsData.find(i => (i.id || i.title) === id);
            } else if (currentSection === 'agents') {
                item = agentsData.find(i => (i.id || i.name) === id);
            }

            if (item) {
                openModal(item);
            }
        });

        // 2. Function to Open Modal and populate data
        function openModal(item) {
            const modal = document.getElementById('detailModal');
            const title = document.getElementById('modalTitle');
            const desc = document.getElementById('modalDescription');
            const content = document.getElementById('modalContent');

            // Populate Data
            title.textContent = item.title || item.name;
            desc.textContent = item.description;

            // Handle content (Skills have 'content', others might just have description)
            content.textContent = item.content || item.prompt || "No additional content details available.";

            // Show Modal
            modal.classList.remove('hidden');

            // Refresh icons inside the modal if you have any
            lucide.createIcons();
        }

        // 3. Function to Close Modal
        function closeModal() {
            document.getElementById('detailModal').classList.add('hidden');
        }

        // 4. Close on Escape key
        document.addEventListener('keydown', function (e) {
            if (e.key === 'Escape') closeModal();
        });

        // 5. Function to Copy Content
        async function copyModalContent(button) {
            const content = document.getElementById('modalContent').textContent;

            try {
                // API to write to clipboard
                await navigator.clipboard.writeText(content);

                // Visual Feedback: Change button text and color
                const originalHTML = button.innerHTML;
                button.innerHTML = '<i data-lucide="check" class="w-4 h-4"></i> Copied!';
                button.classList.remove('bg-blue-600', 'hover:bg-blue-500');
                button.classList.add('bg-green-600', 'hover:bg-green-500');
                lucide.createIcons(); // Re-render the new check icon

                // Reset button after 2 seconds
                setTimeout(() => {
                    button.innerHTML = '<i data-lucide="copy" class="w-4 h-4"></i> Copy Content';
                    button.classList.remove('bg-green-600', 'hover:bg-green-500');
                    button.classList.add('bg-blue-600', 'hover:bg-blue-500');
                    lucide.createIcons();
                }, 2000);

            } catch (err) {
                console.error('Failed to copy:', err);
                alert('Failed to copy content.');
            }
        }
        // 6. Sidebar Toggle
        function toggleSidebar() {
            const sidebar = document.getElementById('sidebar');
            const overlay = document.getElementById('sidebarOverlay');

            if (sidebar.classList.contains('-translate-x-full')) {
                // Open
                sidebar.classList.remove('-translate-x-full');
                overlay.classList.remove('hidden');
            } else {
                // Close
                sidebar.classList.add('-translate-x-full');
                overlay.classList.add('hidden');
            }
        }

        // Auto-dismiss mobile hint after 5 seconds
        setTimeout(() => {
            const hint = document.getElementById('mobileMenuHint');
            if (hint) {
                hint.classList.add('opacity-0');
                setTimeout(() => hint.remove(), 1000);
            }
        }, 5000);

        // Initialize icons for static elements
        lucide.createIcons();
    </script>
</body>

</html>
